backend:
  name: github
  repo: demirrtasfurkan/kible-yonu-hesapla-3
  branch: main

site_url: https://kibleyonuhesapla.com
display_url: https://kibleyonuhesapla.com
logo_url: /assets/icons/favicon.svg
locale: tr

media_folder: src/site/assets/uploads
public_folder: /assets/uploads

collections:
  - name: site_content
    label: Site İçerikleri
    files:
      - name: homepage
        label: Ana Sayfa
        file: src/data/homepage.json
        format: json
        fields:
          - {name: seo_title, label: SEO Başlığı, widget: string}
          - {name: meta_description, label: Meta Açıklaması, widget: text}
          - {name: hero_eyebrow, label: Üst Etiket, widget: string}
          - {name: h1, label: Ana Başlık (H1), widget: string}
          - {name: hero_lead, label: Giriş Metni, widget: text}
          - {name: status_message, label: Başlangıç Durum Mesajı, widget: string}
          - {name: privacy_note, label: Gizlilik Notu, widget: string}
          - {name: footer_description, label: Footer Açıklaması, widget: text}
          - name: guide_sections
            label: Ana Sayfa Rehber Bölümleri
            widget: list
            summary: "{{fields.heading}}"
            fields:
              - {name: heading, label: Bölüm Başlığı, widget: string}
              - {name: paragraphs_before, label: Liste Öncesi Paragraflar, widget: list, field: {name: paragraph, label: Paragraf, widget: text}}
              - {name: tip, label: İpucu Kutusu, widget: text, required: false}
              - name: list_type
                label: Liste Türü
                widget: select
                options:
                  - {label: Liste yok, value: none}
                  - {label: Madde işaretli, value: unordered}
                  - {label: Numaralı, value: ordered}
              - {name: list_items, label: Liste Maddeleri, widget: list, required: false, field: {name: item, label: Madde, widget: string}}
              - {name: paragraphs_after, label: Liste Sonrası Paragraflar, widget: list, required: false, field: {name: paragraph, label: Paragraf, widget: text}}
              - {name: cta_label, label: Buton Metni, widget: string, required: false}
              - {name: cta_url, label: Buton Bağlantısı, widget: string, required: false}
          - {name: faq_heading, label: SSS Başlığı, widget: string}
          - name: faqs
            label: Ana Sayfa Sık Sorulan Sorular
            widget: list
            summary: "{{fields.question}}"
            fields:
              - {name: question, label: Soru, widget: string}
              - {name: answer, label: Cevap, widget: text}
          - {name: closing_copy, label: Kapanış Metni, widget: text}

      - name: about_page
        label: Hakkımızda Sayfası
        file: src/data/pages/hakkimizda.json
        format: json
        fields: &content_page_fields
          - {name: seo_title, label: SEO Başlığı, widget: string}
          - {name: meta_description, label: Meta Açıklaması, widget: text}
          - {name: eyebrow, label: Üst Etiket, widget: string}
          - {name: h1, label: Ana Başlık (H1), widget: string}
          - {name: lead, label: Giriş Metni, widget: text}
          - name: sections
            label: İçerik Bölümleri
            widget: list
            summary: "{{fields.heading}}"
            fields:
              - {name: heading, label: Bölüm Başlığı, widget: string}
              - {name: paragraphs, label: Paragraflar, widget: list, field: {name: paragraph, label: Paragraf, widget: text}}
              - {name: cta_label, label: Bölüm Buton Metni, widget: string, required: false}
              - {name: cta_url, label: Bölüm Buton Bağlantısı, widget: string, required: false}
          - {name: aside_title, label: Yan Kutu Başlığı, widget: string}
          - {name: aside_items, label: Yan Kutu Maddeleri, widget: list, field: {name: item, label: Madde, widget: string}}
          - {name: cta_label, label: Ana Buton Metni, widget: string, required: false}
          - {name: cta_url, label: Ana Buton Bağlantısı, widget: string, required: false}

      - name: privacy_page
        label: Gizlilik Politikası
        file: src/data/pages/gizlilik.json
        format: json
        fields: *content_page_fields

      - name: terms_page
        label: Kullanım Şartları
        file: src/data/pages/kullanim-sartlari.json
        format: json
        fields: *content_page_fields

      - name: contact_page
        label: İletişim Sayfası
        file: src/data/pages/iletisim.json
        format: json
        fields: *content_page_fields

      - name: calculation_page
        label: Hesaplama Yöntemi
        file: src/data/pages/hesaplama-yontemi.json
        format: json
        fields: *content_page_fields

      - name: faq_page
        label: Sık Sorulan Sorular Sayfası
        file: src/data/pages/sikca-sorulan-sorular.json
        format: json
        fields:
          - {name: seo_title, label: SEO Başlığı, widget: string}
          - {name: meta_description, label: Meta Açıklaması, widget: text}
          - {name: eyebrow, label: Üst Etiket, widget: string}
          - {name: h1, label: Ana Başlık (H1), widget: string}
          - {name: lead, label: Giriş Metni, widget: text}
          - name: intro_sections
            label: Rehber Bölümleri
            widget: list
            summary: "{{fields.heading}}"
            fields:
              - {name: heading, label: Bölüm Başlığı, widget: string}
              - {name: paragraphs, label: Paragraflar, widget: list, field: {name: paragraph, label: Paragraf, widget: text}}
          - {name: faq_heading, label: SSS Başlığı, widget: string}
          - name: faqs
            label: Sorular ve Cevaplar
            widget: list
            summary: "{{fields.question}}"
            fields:
              - {name: question, label: Soru, widget: string}
              - {name: answer, label: Cevap, widget: text}
          - {name: aside_title, label: Yan Kutu Başlığı, widget: string}
          - {name: aside_items, label: Yan Kutu Maddeleri, widget: list, field: {name: item, label: Madde, widget: string}}
          - {name: cta_label, label: Ana Buton Metni, widget: string}
          - {name: cta_url, label: Ana Buton Bağlantısı, widget: string}

      - name: blog
        label: Blog Yazıları
        file: src/data/blog.json
        format: json
        fields:
          - name: posts
            label: Yazılar
            widget: list
            summary: "{{fields.title}}"
            fields:
              - name: slug
                label: URL Slug
                widget: string
                hint: Yayındaki bir yazıda bu alanı değiştirmek URL'yi değiştirir.
                pattern: ['^[a-z0-9-]+$', 'Yalnızca küçük harf, rakam ve tire kullanın.']
              - {name: title, label: Başlık, widget: string}
              - {name: description, label: Meta Açıklaması, widget: text}
              - {name: excerpt, label: Kart Özeti, widget: text}
              - {name: reading_time, label: Okuma Süresi, widget: string, hint: "Örnek: 5 dk"}
              - name: sections
                label: Yazı Bölümleri
                widget: list
                summary: "{{fields.heading}}"
                fields:
                  - {name: heading, label: Bölüm Başlığı, widget: string}
                  - {name: paragraphs, label: Paragraflar, widget: list, field: {name: paragraph, label: Paragraf, widget: text}}
              - name: faq
                label: Sık Sorulan Sorular
                widget: list
                required: false
                summary: "{{fields.question}}"
                fields:
                  - {name: question, label: Soru, widget: string}
                  - {name: answer, label: Cevap, widget: text}

      - name: cities
        label: Şehir Verileri
        file: src/data/cities.json
        format: json
        fields:
          - name: cities
            label: Şehirler
            widget: list
            summary: "{{fields.name}}"
            hint: Koordinat, açı ve mesafe alanları hesaplama sonuçlarını etkiler; yalnızca doğrulanmış değerlerle değiştirin.
            fields:
              - {name: name, label: Şehir Adı, widget: string}
              - name: slug
                label: URL Slug
                widget: string
                hint: Bu alanı değiştirmek şehir sayfasının URL'sini değiştirir.
                pattern: ['^[a-z0-9-]+$', 'Yalnızca küçük harf, rakam ve tire kullanın.']
              - {name: lat, label: Enlem, widget: number, value_type: float}
              - {name: lng, label: Boylam, widget: number, value_type: float}
              - {name: bearing, label: Kıble Açısı, widget: number, value_type: float}
              - {name: direction, label: Yön Açıklaması, widget: string}
              - {name: distance, label: Kâbe Mesafesi (km), widget: number, value_type: float}
              - name: nearby
                label: Yakın Şehirler
                widget: list
                summary: "{{fields.name}}"
                fields:
                  - {name: name, label: Şehir Adı, widget: string}
                  - {name: slug, label: URL Slug, widget: string}
                  - {name: distance, label: Mesafe (km), widget: number, value_type: float}
              - name: districts
                label: İlçeler
                widget: list
                collapsed: true
                summary: "{{fields.name}} · {{fields.bearing}}°"
                hint: İlçe koordinatları ve kıble değerleri şehir sayfasındaki tabloyu ve yerel aramayı besler.
                fields:
                  - {name: name, label: İlçe Adı, widget: string}
                  - {name: slug, label: İlçe Slug, widget: string}
                  - {name: lat, label: Enlem, widget: number, value_type: float}
                  - {name: lng, label: Boylam, widget: number, value_type: float}
                  - {name: bearing, label: Kıble Açısı, widget: number, value_type: float}
                  - {name: direction, label: Yön, widget: string}
                  - {name: distance, label: Kâbe Mesafesi (km), widget: number, value_type: float}
